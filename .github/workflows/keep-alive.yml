# Keeps the free Supabase project awake (free projects pause after about a week
# without activity) and resets the shared demo account, every 3 days.
#
# The secret key comes only from the SUPABASE_SECRET_KEY repository secret, as an
# environment variable for the one step that needs it. GitHub masks secrets in
# logs, and the script prints counts only. No `set -x`, no echoing of env.
name: Keep Supabase awake and reset the demo

on:
  schedule:
    - cron: '17 6 */3 * *' # 06:17 UTC every 3 days
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Scripts skipped: only supabase-js is needed, not the Supabase CLI's binary download.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reset the demo account (writes to the database, so the project stays active)
        run: node scripts/demo-reset.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
