<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SVG favicon switches green/mint with prefers-color-scheme; PNGs are fallbacks.
         Regenerate the PNGs with `node scripts/icons.mjs`. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plainly: shop without the noise. Decide with facts, not noise." />
    <meta name="color-scheme" content="light dark" />
    <title>Plainly</title>
    <!-- Set the theme class before first paint so there is no flash of the wrong theme.
         Reads the Zustand-persisted value written by src/theme/theme.ts. -->
    <script>
      (function () {
        var choice = 'system'
        try {
          var saved = JSON.parse(localStorage.getItem('plainly-theme'))
          if (saved && saved.state && saved.state.choice) choice = saved.state.choice
        } catch (e) {}
        var dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
      // The display settings from /accessibility (src/a11y/display.ts), also before first paint.
      ;(function () {
        try {
          var s = (JSON.parse(localStorage.getItem('plainly-display')) || {}).state || {}
          var root = document.documentElement
          if (s.textSize === 'large' || s.textSize === 'larger') root.setAttribute('data-text', s.textSize)
          if (s.contrast) root.setAttribute('data-contrast', 'more')
          if (s.reduceMotion) root.setAttribute('data-motion', 'reduce')
          if (s.underlineLinks) root.setAttribute('data-underline', 'links')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
